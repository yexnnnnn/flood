<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1123" viewBox="0 0 2200 1123"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#141414" stroke-width="1.2"/></marker><radialGradient id="gblue"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#2f5bea"/><stop offset=".55" stop-color="#2f5bea" stop-opacity=".3"/><stop offset="1" stop-color="#2f5bea" stop-opacity="0"/></radialGradient><radialGradient id="ablue"><stop offset="0" stop-color="#2f5bea" stop-opacity=".55"/><stop offset=".45" stop-color="#2f5bea" stop-opacity=".16"/><stop offset="1" stop-color="#2f5bea" stop-opacity="0"/></radialGradient><radialGradient id="gyellow"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#e2a900"/><stop offset=".55" stop-color="#e2a900" stop-opacity=".3"/><stop offset="1" stop-color="#e2a900" stop-opacity="0"/></radialGradient><radialGradient id="ayellow"><stop offset="0" stop-color="#e2a900" stop-opacity=".55"/><stop offset=".45" stop-color="#e2a900" stop-opacity=".16"/><stop offset="1" stop-color="#e2a900" stop-opacity="0"/></radialGradient><radialGradient id="gorange"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#e8681a"/><stop offset=".55" stop-color="#e8681a" stop-opacity=".3"/><stop offset="1" stop-color="#e8681a" stop-opacity="0"/></radialGradient><radialGradient id="aorange"><stop offset="0" stop-color="#e8681a" stop-opacity=".55"/><stop offset=".45" stop-color="#e8681a" stop-opacity=".16"/><stop offset="1" stop-color="#e8681a" stop-opacity="0"/></radialGradient><radialGradient id="gred"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#d63a2b"/><stop offset=".55" stop-color="#d63a2b" stop-opacity=".3"/><stop offset="1" stop-color="#d63a2b" stop-opacity="0"/></radialGradient><radialGradient id="ared"><stop offset="0" stop-color="#d63a2b" stop-opacity=".55"/><stop offset=".45" stop-color="#d63a2b" stop-opacity=".16"/><stop offset="1" stop-color="#d63a2b" stop-opacity="0"/></radialGradient><linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".3" stop-color="#fff" stop-opacity=".88"/><stop offset="1" stop-color="#fff" stop-opacity=".96"/></linearGradient></defs><rect x="0.0" y="0.0" width="2200.0" height="1123.0" rx="0" fill="#f3f1ec"/><circle cx="1940.0" cy="1043.0" r="520" fill="url(#ayellow)"/><text x="80.0" y="64.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="11" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.88">CBEWS — SHENJIA'AN VILLAGE, LAISHUI</text><text x="2120.0" y="64.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="11" font-weight="400" fill="#141414" text-anchor="end" letter-spacing="0.88">04 / 05 — SERVICE BLUEPRINT</text><line x1="80.0" y1="82.0" x2="2120.0" y2="82.0" stroke="#141414" stroke-width="1"/><text x="80.0" y="190.0" font-family="Instrument Serif, Cormorant Garamond, Georgia, serif" font-size="84" font-weight="400" fill="#141414" text-anchor="start">What it takes, behind the glow.</text><text x="1600.0" y="140.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#141414" text-anchor="start">Above the line of visibility is what villagers meet: a</text><text x="1600.0" y="164.8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#141414" text-anchor="start">button, a map, a voice on the loudspeaker. Below it are the</text><text x="1600.0" y="189.6" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#141414" text-anchor="start">grid workers, officials, data and partners that make each</text><text x="1600.0" y="214.4" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#141414" text-anchor="start">moment work.</text><circle cx="85.0" cy="258.0" r="5" fill="#2f5bea"/><text x="96.0" y="262.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="11" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.88">BLUE — WATCH</text><circle cx="222.1" cy="258.0" r="5" fill="#e2a900"/><text x="233.1" y="262.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="11" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.88">YELLOW — PREPARE</text><circle cx="389.5" cy="258.0" r="5" fill="#e8681a"/><text x="400.5" y="262.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="11" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.88">ORANGE — LEAVE THE GULLY</text><circle cx="617.7" cy="258.0" r="5" fill="#d63a2b"/><text x="628.7" y="262.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="11" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.88">RED — EVACUATE NOW</text><line x1="80.0" y1="292.0" x2="2120.0" y2="292.0" stroke="#cfcac0" stroke-width="1"/><line x1="80.0" y1="1053.0" x2="2120.0" y2="1053.0" stroke="#cfcac0" stroke-width="1"/><text x="80.0" y="1081.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="10" font-weight="400" fill="#8a867d" text-anchor="start" letter-spacing="0.80">COMMUNITY-BASED EARLY WARNING SYSTEM · 2026</text><text x="2120.0" y="1081.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="10" font-weight="400" fill="#8a867d" text-anchor="end" letter-spacing="0.80">OBSERVE → MAP → ASSESS → ALERT → EVACUATE</text><text x="340.0" y="340.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="10" font-weight="400" fill="#8a867d" text-anchor="start" letter-spacing="0.80">01</text><text x="340.0" y="380.0" font-family="Instrument Serif, Cormorant Garamond, Georgia, serif" font-size="36" font-weight="400" fill="#141414" text-anchor="start">Observe</text><text x="696.0" y="340.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="10" font-weight="400" fill="#8a867d" text-anchor="start" letter-spacing="0.80">02</text><text x="696.0" y="380.0" font-family="Instrument Serif, Cormorant Garamond, Georgia, serif" font-size="36" font-weight="400" fill="#141414" text-anchor="start">Map</text><text x="1052.0" y="340.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="10" font-weight="400" fill="#8a867d" text-anchor="start" letter-spacing="0.80">03</text><text x="1052.0" y="380.0" font-family="Instrument Serif, Cormorant Garamond, Georgia, serif" font-size="36" font-weight="400" fill="#141414" text-anchor="start">Assess</text><text x="1408.0" y="340.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="10" font-weight="400" fill="#8a867d" text-anchor="start" letter-spacing="0.80">04</text><text x="1408.0" y="380.0" font-family="Instrument Serif, Cormorant Garamond, Georgia, serif" font-size="36" font-weight="400" fill="#141414" text-anchor="start">Alert</text><text x="1764.0" y="340.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="10" font-weight="400" fill="#8a867d" text-anchor="start" letter-spacing="0.80">05</text><text x="1764.0" y="380.0" font-family="Instrument Serif, Cormorant Garamond, Georgia, serif" font-size="36" font-weight="400" fill="#141414" text-anchor="start">Evacuate</text><line x1="80.0" y1="404.0" x2="2120.0" y2="404.0" stroke="#141414" stroke-width="1"/><text x="80.0" y="440.0" font-family="Instrument Serif, Cormorant Garamond, Georgia, serif" font-size="24" font-weight="400" fill="#141414" text-anchor="start">Physical evidence</text><text x="80.0" y="462.0" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#8a867d" text-anchor="start" letter-spacing="0.72">WHAT PEOPLE SEE AND TOUCH</text><text x="340.0" y="438.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Button device · app home · saying cards</text><text x="696.0" y="438.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Glowing circles on the map</text><text x="1052.0" y="438.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">If / Then rule card</text><text x="1408.0" y="438.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Broadcast bar · alert · loudspeaker ·</text><text x="1408.0" y="459.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">SMS</text><text x="1764.0" y="438.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Route · signs · shelter supply list</text><line x1="80.0" y1="496.6" x2="2120.0" y2="496.6" stroke="#cfcac0" stroke-width="1"/><rect x="80.0" y="496.6" width="2040.0" height="92.6" rx="0" fill="#ebe8e1" opacity="0.75"/><text x="80.0" y="532.6" font-family="Instrument Serif, Cormorant Garamond, Georgia, serif" font-size="24" font-weight="400" fill="#141414" text-anchor="start">Resident actions</text><text x="80.0" y="554.6" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#8a867d" text-anchor="start" letter-spacing="0.72">WHAT VILLAGERS DO</text><text x="340.0" y="530.6" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Notices a change, holds the button and</text><text x="340.0" y="551.6" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">speaks</text><text x="696.0" y="530.6" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Looks at nearby reports, taps “I see it</text><text x="696.0" y="551.6" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">too”</text><text x="1052.0" y="530.6" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Reads the rule card; answers the grid</text><text x="1052.0" y="551.6" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">worker’s call</text><text x="1408.0" y="530.6" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Prepares or leaves according to the</text><text x="1408.0" y="551.6" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">level</text><text x="1764.0" y="530.6" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Follows the route, checks in at the</text><text x="1764.0" y="551.6" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">shelter</text><line x1="80.0" y1="589.2" x2="2120.0" y2="589.2" stroke="#cfcac0" stroke-width="1"/><line x1="80.0" y1="605.2" x2="2120.0" y2="605.2" stroke="#141414" stroke-width="1" stroke-dasharray="6 5"/><text x="2120.0" y="595.2" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#141414" text-anchor="end" letter-spacing="0.72">LINE OF INTERACTION</text><text x="80.0" y="657.2" font-family="Instrument Serif, Cormorant Garamond, Georgia, serif" font-size="24" font-weight="400" fill="#141414" text-anchor="start">Frontstage</text><text x="80.0" y="679.2" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#8a867d" text-anchor="start" letter-spacing="0.72">WHAT STAFF AND SYSTEM SHOW</text><text x="340.0" y="655.2" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">App confirms the category; the device</text><text x="340.0" y="676.2" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">lights green and says “received”</text><text x="696.0" y="655.2" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">The map shows unverified circles and</text><text x="696.0" y="676.2" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">merged counts live</text><text x="1052.0" y="655.2" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Grid worker calls or visits to verify</text><text x="1408.0" y="655.2" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">App bar + alert; loudspeakers; button</text><text x="1408.0" y="676.2" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">devices; door-to-door</text><text x="1764.0" y="655.2" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Personal route and departure time;</text><text x="1764.0" y="676.2" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">shelter staff welcome people</text><line x1="80.0" y1="713.8" x2="2120.0" y2="713.8" stroke="#cfcac0" stroke-width="1"/><line x1="80.0" y1="729.8" x2="2120.0" y2="729.8" stroke="#141414" stroke-width="1" stroke-dasharray="6 5"/><text x="2120.0" y="719.8" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#141414" text-anchor="end" letter-spacing="0.72">LINE OF VISIBILITY</text><text x="80.0" y="781.8" font-family="Instrument Serif, Cormorant Garamond, Georgia, serif" font-size="24" font-weight="400" fill="#141414" text-anchor="start">Backstage</text><text x="80.0" y="803.8" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#8a867d" text-anchor="start" letter-spacing="0.72">WHAT HAPPENS OUT OF SIGHT</text><text x="340.0" y="779.8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Dialect speech-to-text · location ·</text><text x="340.0" y="800.8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">de-duplication</text><text x="696.0" y="779.8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Classifier + matching against the</text><text x="696.0" y="800.8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">sayings library</text><text x="1052.0" y="779.8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Rule engine scores; a village official</text><text x="1052.0" y="800.8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">decides the level</text><text x="1408.0" y="779.8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Broadcast drafted automatically; one-tap</text><text x="1408.0" y="800.8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">approval</text><text x="1764.0" y="779.8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Departure time per household; roll call;</text><text x="1764.0" y="800.8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">find the missing</text><line x1="80.0" y1="838.4" x2="2120.0" y2="838.4" stroke="#cfcac0" stroke-width="1"/><line x1="80.0" y1="854.4" x2="2120.0" y2="854.4" stroke="#141414" stroke-width="1" stroke-dasharray="6 5"/><text x="2120.0" y="844.4" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#141414" text-anchor="end" letter-spacing="0.72">LINE OF INTERNAL INTERACTION</text><text x="80.0" y="906.4" font-family="Instrument Serif, Cormorant Garamond, Georgia, serif" font-size="24" font-weight="400" fill="#141414" text-anchor="start">Support</text><text x="80.0" y="928.4" font-family="JetBrains Mono, IBM Plex Mono, SF Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#8a867d" text-anchor="start" letter-spacing="0.72">SYSTEMS AND PARTNERS</text><text x="340.0" y="904.4" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Button devices · 4G / Wi-Fi · offline</text><text x="340.0" y="925.4" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">cache</text><text x="696.0" y="904.4" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">3D village map · observation database</text><text x="1052.0" y="904.4" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Rain, river and weather feeds; rule</text><text x="1052.0" y="925.4" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">library (Trial / Verified)</text><text x="1408.0" y="904.4" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Loudspeaker system · SMS gateway · push</text><text x="1408.0" y="925.4" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">service</text><text x="1764.0" y="904.4" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">Household and health data (with consent)</text><text x="1764.0" y="925.4" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#141414" text-anchor="start">· shelter stock · pace table</text><line x1="80.0" y1="963.0" x2="2120.0" y2="963.0" stroke="#cfcac0" stroke-width="1"/><line x1="672.0" y1="404.0" x2="672.0" y2="963.0" stroke="#cfcac0" stroke-width="1" stroke-dasharray="1 4"/><line x1="1028.0" y1="404.0" x2="1028.0" y2="963.0" stroke="#cfcac0" stroke-width="1" stroke-dasharray="1 4"/><line x1="1384.0" y1="404.0" x2="1384.0" y2="963.0" stroke="#cfcac0" stroke-width="1" stroke-dasharray="1 4"/><line x1="1740.0" y1="404.0" x2="1740.0" y2="963.0" stroke="#cfcac0" stroke-width="1" stroke-dasharray="1 4"/><text x="80.0" y="1007.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a867d" text-anchor="start">Figures are samples. Age and health data are used only with consent, only to set departure times, and never shown to others.</text></svg>